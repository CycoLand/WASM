<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Browser LLM Chat - Transformers.js POC</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            color: #e4e4e7;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        header {
            text-align: center;
            padding: 15px 0;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            margin-bottom: 15px;
        }

        header h1 {
            font-size: 1.6rem;
            background: linear-gradient(90deg, #60a5fa, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        header p {
            color: #9ca3af;
            margin-top: 6px;
            font-size: 0.85rem;
        }

        .model-selector {
            background: rgba(255,255,255,0.05);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 15px;
        }

        .model-selector-header {
            display: flex;
            gap: 12px;
            align-items: center;
            flex-wrap: wrap;
        }

        .model-selector label {
            font-weight: 600;
            font-size: 0.9rem;
        }

        .model-selector select {
            flex: 1;
            min-width: 200px;
            background: rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 8px;
            padding: 10px 12px;
            color: #e4e4e7;
            font-size: 0.95rem;
            cursor: pointer;
        }

        .model-selector select:focus {
            outline: none;
            border-color: #60a5fa;
        }

        .model-selector button {
            background: linear-gradient(135deg, #10b981, #059669);
            border: none;
            border-radius: 8px;
            padding: 10px 20px;
            color: white;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, opacity 0.2s;
        }

        .model-selector button:hover:not(:disabled) {
            transform: scale(1.02);
        }

        .model-selector button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .model-info {
            margin-top: 12px;
            padding: 10px 12px;
            background: rgba(0,0,0,0.2);
            border-radius: 8px;
            font-size: 0.85rem;
            line-height: 1.5;
        }

        .status-bar {
            background: rgba(255,255,255,0.05);
            border-radius: 12px;
            padding: 14px;
            margin-bottom: 15px;
        }

        .status-bar .status-text {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 8px;
        }

        .status-bar .status-text .indicator {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #fbbf24;
            animation: pulse 1.5s infinite;
        }

        .status-bar .status-text .indicator.ready {
            background: #34d399;
            animation: none;
        }

        .status-bar .status-text .indicator.error {
            background: #f87171;
            animation: none;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .progress-container {
            background: rgba(0,0,0,0.3);
            border-radius: 8px;
            overflow: hidden;
            height: 6px;
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #60a5fa, #a78bfa);
            width: 0%;
            transition: width 0.3s ease;
        }

        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            min-height: 200px;
        }

        .message {
            max-width: 85%;
            padding: 12px 16px;
            border-radius: 16px;
            line-height: 1.6;
            white-space: pre-wrap;
            font-size: 0.95rem;
        }

        .message.user {
            background: #3b82f6;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }

        .message.assistant {
            background: rgba(255,255,255,0.1);
            align-self: flex-start;
            border-bottom-left-radius: 4px;
        }

        .message.assistant.generating::after {
            content: '▋';
            animation: blink 1s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        .input-area {
            display: flex;
            gap: 12px;
            padding: 15px 0;
            border-top: 1px solid rgba(255,255,255,0.1);
        }

        .input-area textarea {
            flex: 1;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 12px;
            padding: 12px 16px;
            color: #e4e4e7;
            font-size: 1rem;
            resize: none;
            outline: none;
            font-family: inherit;
        }

        .input-area textarea:focus {
            border-color: #60a5fa;
        }

        .input-area textarea::placeholder {
            color: #6b7280;
        }

        .input-area button {
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            border: none;
            border-radius: 12px;
            padding: 12px 24px;
            color: white;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, opacity 0.2s;
        }

        .input-area button:hover:not(:disabled) {
            transform: scale(1.02);
        }

        .input-area button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .stats {
            display: none;
            gap: 20px;
            font-size: 0.8rem;
            color: #9ca3af;
            margin-top: 8px;
        }

        .stats span {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .cache-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 10px;
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.3);
            border-radius: 8px;
            padding: 10px 14px;
            margin-bottom: 12px;
            font-size: 0.85rem;
        }

        .cache-status {
            display: flex;
            align-items: center;
            gap: 10px;
            color: #6ee7b7;
        }

        .cache-status .cache-icon {
            font-size: 1.2rem;
        }

        .cache-status .cache-text small {
            color: #9ca3af;
        }

        .cache-buttons {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .cache-bar button {
            border-radius: 6px;
            padding: 6px 12px;
            font-size: 0.8rem;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            border: 1px solid;
        }

        .cache-bar button:hover:not(:disabled) {
            transform: scale(1.02);
        }

        .cache-bar button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .cache-bar button.btn-danger {
            background: rgba(239, 68, 68, 0.2);
            border-color: rgba(239, 68, 68, 0.4);
            color: #fca5a5;
        }

        .cache-bar button.btn-danger:hover:not(:disabled) {
            background: rgba(239, 68, 68, 0.3);
        }

        .cache-bar button.btn-primary {
            background: rgba(59, 130, 246, 0.2);
            border-color: rgba(59, 130, 246, 0.4);
            color: #93c5fd;
        }

        .cache-bar button.btn-primary:hover:not(:disabled) {
            background: rgba(59, 130, 246, 0.3);
        }

        .cache-bar button.btn-success {
            background: rgba(16, 185, 129, 0.2);
            border-color: rgba(16, 185, 129, 0.4);
            color: #6ee7b7;
        }

        .cache-bar button.btn-success:hover:not(:disabled) {
            background: rgba(16, 185, 129, 0.3);
        }

        .info-banner {
            background: rgba(59, 130, 246, 0.1);
            border: 1px solid rgba(59, 130, 246, 0.3);
            border-radius: 8px;
            padding: 10px 14px;
            margin-bottom: 12px;
            font-size: 0.8rem;
            color: #93c5fd;
        }

        .info-banner a {
            color: #60a5fa;
        }

        @media (max-width: 600px) {
            .model-selector-header {
                flex-direction: column;
                align-items: stretch;
            }
            
            .model-selector select {
                min-width: 100%;
            }
            
            .message {
                max-width: 95%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🧠 Browser LLM Chat</h1>
            <p>Run AI models entirely in your browser with ONNX + WebGPU — no server required!</p>
        </header>

        <div class="info-banner">
            <strong>💡 How it works:</strong> Models run 100% locally using 
            <a href="https://huggingface.co/docs/transformers.js" target="_blank">Transformers.js</a> + 
            <a href="https://developer.mozilla.org/en-US/docs/Web/API/WebGPU_API" target="_blank">WebGPU</a>. 
            Your data never leaves your device!
        </div>

        <div class="cache-bar">
            <div class="cache-status" id="cacheStatus">
                <span class="cache-icon">💾</span>
                <span class="cache-text">Checking cache...</span>
            </div>
            <div class="cache-buttons">
                <button id="exportModelsBtn" class="btn-primary" title="Save models to disk">📤 Export</button>
                <button id="importModelsBtn" class="btn-success" title="Load models from disk">📥 Import</button>
                <button id="clearCacheBtn" class="btn-danger" style="display: none;">🗑️ Clear</button>
            </div>
        </div>

        <div class="model-selector">
            <div class="model-selector-header">
                <label for="modelSelect">🤖 Model:</label>
                <select id="modelSelect"></select>
                <button id="loadModelBtn">Load Model</button>
            </div>
            <div class="model-info" id="modelInfo"></div>
        </div>

        <div class="status-bar">
            <div class="status-text">
                <div class="indicator" id="statusIndicator"></div>
                <span id="statusText">Select a model to begin</span>
            </div>
            <div class="progress-container">
                <div class="progress-bar" id="progressBar"></div>
            </div>
            <div class="stats" id="stats">
                <span>🔢 <span id="tokenCount">0</span> tokens</span>
                <span>⚡ <span id="tokensPerSec">0</span> tok/s</span>
                <span>⏱️ <span id="inferenceTime">0</span>ms</span>
            </div>
        </div>

        <div class="chat-container" id="chatContainer">
            <!-- Messages will be added here -->
        </div>

        <div class="input-area">
            <textarea 
                id="userInput" 
                placeholder="Type your message... (Shift+Enter for new line)"
                rows="2"
                disabled
            ></textarea>
            <button id="sendButton" disabled>Send</button>
        </div>
    </div>

    <script type="module" src="main.js"></script>
</body>
</html>
